<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Orbit Defense — Prototype 5</title><style>
*{box-sizing:border-box}html,body{margin:0;touch-action:none;overflow:hidden;background:#07101e;color:#eaf8ff;font-family:system-ui,sans-serif;overscroll-behavior:none}body{height:100dvh;height:100svh;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}main{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:100%;height:100dvh;margin:0;padding:10px;padding-bottom:max(12px,env(safe-area-inset-bottom));min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:9px}header,.stats,.controls{display:flex;justify-content:space-between;align-items:center;gap:10px}header strong{letter-spacing:.07em}.stats{font-size:13px}.arena{position:relative;flex:1;min-height:150px;border:1px solid #35516b;border-radius:13px;overflow:hidden;user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}button{-webkit-tap-highlight-color:transparent;user-select:none;border:0;border-radius:12px;background:#158c87;color:white;font-size:16px;font-weight:800;padding:15px 18px;touch-action:none;cursor:pointer}.secondary{background:#20344c;font-size:13px;padding:9px 13px}.controls{min-height:125px;flex-shrink:0;align-items:center;padding:0 12px;touch-action:none}.joystick{width:116px;height:116px;border:2px solid #4c7c99;border-radius:50%;background:radial-gradient(circle,#1c3a54,#0b1a2b);position:relative;touch-action:none;user-select:none;flex-shrink:0}.joystick:after{content:'SHIELD';position:absolute;bottom:-18px;left:0;right:0;text-align:center;color:#91b5c9;font-size:10px;letter-spacing:.15em}.knob{position:absolute;width:45px;height:45px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#69d8cc;border:3px solid #c3fff4;box-shadow:0 0 16px #37d9c988;pointer-events:none}.right{display:flex;flex-direction:column;align-items:center;gap:7px}#deflect{width:125px;height:76px;background:#bd6652;border:2px solid #ffb49d;box-shadow:0 4px 0 #753b36}#deflect:active{transform:translateY(3px);box-shadow:0 1px 0 #753b36}#deflect:disabled{opacity:.5}.right small{color:#a4c0d1;font-size:11px}.bar{height:7px;border-radius:7px;background:#284057;overflow:hidden}.bar div{height:100%;background:#5de2c4;width:0%}#overlay{position:absolute;inset:0;background:#071324ee;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;gap:12px;z-index:2}#overlay h1{margin:0;font-size:24px}#overlay p{line-height:1.5;max-width:320px;color:#b6cfe0}#message{color:#7ce8cf;font-size:13px;min-height:20px;text-align:center}#cool{height:5px;width:125px;background:#293d51;border-radius:6px;overflow:hidden}#cool div{height:100%;width:100%;background:#e7b48a}
</style></head><body><main><header><strong>ORBIT DEFENSE <span style="color:#74d9cc;font-size:11px">V5</span></strong><button id="restart" class="secondary">Restart</button></header><div class="stats"><span>Score <b id="score">0</b></span><span>Hull <b id="hull">5/5</b></span><span>Combo <b id="combo">×1</b></span><span>Time <b id="time">90</b>s</span></div><div class="bar"><div id="progress"></div></div><div class="arena" id="arena"><canvas id="game"></canvas><div id="overlay"><h1 id="heading">THE EVACUATION</h1><p id="description">Protect the refugee transport for 90 seconds. Aim the shield with the bottom-left joystick. Tap DEFLECT as a projectile approaches the shield to send it back at its attacker.</p><button id="start">Begin evacuation</button></div></div><div class="controls"><div id="joystick" class="joystick" aria-label="Shield direction joystick"><div id="knob" class="knob"></div></div><div class="right"><button id="deflect">⚡ DEFLECT</button><div id="cool"><div id="coolfill"></div></div><small>Tap shortly before impact</small></div></div><div id="message" aria-live="polite">Counter window: 0.55 seconds</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),arena=$('arena'),joy=$('joystick'),knob=$('knob');const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),ad=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));let W=360,H=450,cx=180,cy=225,R=80,shield=-Math.PI/2,stars=[],enemies=[],shots=[],returns=[],sparks=[],running=false,token=0,last=0,elapsed=0,spawn=0,score=0,hull=5,combo=0,counter=0,cooldown=0,flash=0,enemyId=0,activePointer=null;function resize(){let b=arena.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=b.width;H=b.height;canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);cx=W/2;cy=H*.51;R=Math.min(W*.23,H*.19);stars=Array.from({length:70},()=>({x:rand(0,W),y:rand(0,H),s:rand(10,36),r:rand(.6,1.7)}))}function hud(){$('score').textContent=score.toLocaleString();$('hull').textContent=hull+'/5';$('combo').textContent='×'+Math.min(5,1+Math.floor(combo/3));$('time').textContent=Math.ceil(Math.max(0,90-elapsed));$('progress').style.width=Math.min(100,elapsed/90*100)+'%';$('coolfill').style.width=((1-Math.min(1,cooldown/.55))*100)+'%';$('deflect').disabled=!running||cooldown>0}function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=rand(0,TAU),v=rand(30,140);sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:rand(.2,.65),color})}}function start(){token++;running=true;last=performance.now();elapsed=0;spawn=.6;score=0;hull=5;combo=0;counter=0;cooldown=0;flash=0;enemyId=0;shield=-Math.PI/2;enemies=[];shots=[];returns=[];sparks=[];$('overlay').style.display='none';$('message').textContent='Refugee transport departing…';hud();requestAnimationFrame(t=>tick(t,token))}function end(win){running=false;if(win)score+=500+hull*100;hud();$('heading').textContent=win?'SAFE HARBOR REACHED':'TRANSPORT DISABLED';$('description').textContent=(win?'The refugees made it to safety. ':'The transport was lost. ')+'Final score: '+score.toLocaleString()+'. Hull: '+hull+'/5.';$('start').textContent='Play again';$('overlay').style.display='flex'}function aimJoy(e){let b=joy.getBoundingClientRect(),x=e.clientX-(b.left+b.width/2),y=e.clientY-(b.top+b.height/2),len=Math.hypot(x,y);if(len>8)shield=Math.atan2(y,x);let limit=Math.min(b.width,b.height)*.27,k=Math.min(limit,len)/(len||1);knob.style.left=(b.width/2+x*k)+'px';knob.style.top=(b.height/2+y*k)+'px'}function resetJoy(){knob.style.left='50%';knob.style.top='50%'}joy.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;e.preventDefault();activePointer=e.pointerId;e.stopPropagation();joy.setPointerCapture(e.pointerId);aimJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;if(e.pointerId===activePointer){e.preventDefault();e.stopPropagation();aimJoy(e)}});for(let ev of ['pointerup','pointercancel','lostpointercapture'])joy.addEventListener(ev,e=>{if(e.pointerId===activePointer){activePointer=null;resetJoy()}});// iOS Safari: handle joystick with native touch events, independently of page gestures.
let joyTouchId=null;
function touchPoint(e){
  for(const t of e.changedTouches)if(t.identifier===joyTouchId)return t;
  return null;
}
joy.addEventListener('touchstart',e=>{
  if(joyTouchId===null && e.changedTouches.length){
    joyTouchId=e.changedTouches[0].identifier;
    aimJoy(e.changedTouches[0]);
  }
  if(e.cancelable)e.preventDefault();
  e.stopPropagation();
},{passive:false});
joy.addEventListener('touchmove',e=>{
  const t=touchPoint(e);
  if(t)aimJoy(t);
  if(e.cancelable)e.preventDefault();
  e.stopPropagation();
},{passive:false});
for(const type of ['touchend','touchcancel']){
  joy.addEventListener(type,e=>{
    if(touchPoint(e)){joyTouchId=null;resetJoy()}
    if(e.cancelable)e.preventDefault();
    e.stopPropagation();
  },{passive:false});
}
function deflect(){if(!running||cooldown>0)return;counter=.55;cooldown=.55;flash=.20;$('message').textContent='DEFLECT READY — shield glowing!' ;hud()}$('deflect').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();try{$('deflect').setPointerCapture(e.pointerId)}catch(_){}deflect()});$('start').onclick=start;$('restart').onclick=start;window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();deflect()}if(e.code==='ArrowLeft')shield-=.12;if(e.code==='ArrowRight')shield+=.12});document.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{capture:true,passive:false});document.addEventListener('touchstart',e=>{if(e.touches.length>1&&e.cancelable)e.preventDefault()},{capture:true,passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});function addEnemy(){let a=rand(0,TAU),id=++enemyId;enemies.push({id,a,d:Math.max(R*2.0,Math.min(W,H)*.43),hp:1,phase:rand(0,TAU),angular:rand(.13,.32)*(Math.random()<.5?-1:1),reload:rand(.6,1.4),age:0})}function position(e){let angle=e.a+Math.sin(e.age*.8+e.phase)*.07;return{x:cx+Math.cos(angle)*e.d,y:cy+Math.sin(angle)*e.d,a:angle}}function shoot(e){let p=position(e),a=Math.atan2(cy-p.y,cx-p.x);shots.push({x:p.x,y:p.y,vx:Math.cos(a)*rand(76,105),vy:Math.sin(a)*rand(76,105),owner:e.id,dead:false})}function tick(t,id){if(id!==token||!running)return;let dt=Math.min(.04,(t-last)/1000);last=t;elapsed+=dt;spawn-=dt;counter=Math.max(0,counter-dt);cooldown=Math.max(0,cooldown-dt);flash=Math.max(0,flash-dt);if(spawn<=0&&enemies.length<Math.min(6,2+Math.floor(elapsed/20))){addEnemy();spawn=rand(2.2,3.3)}for(let s of stars){s.y+=s.s*dt;if(s.y>H)s.y=0}for(let e of enemies){e.age+=dt;e.a+=e.angular*dt;e.reload-=dt;if(e.reload<=0){shoot(e);e.reload=rand(2.0,3.2)*Math.max(.68,1-elapsed/220)}}for(let p of shots){let ox=p.x-cx,oy=p.y-cy,old=Math.hypot(ox,oy);p.x+=p.vx*dt;p.y+=p.vy*dt;let dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx);if(old>=R&&d<=R+7&&Math.abs(ad(a,shield))<.37){p.dead=true;let x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;if(counter>0){counter=0;combo++;let mult=Math.min(5,1+Math.floor(combo/3));score+=50*mult;burst(x,y,'#82ffe5',15);let enemy=enemies.find(e=>e.id===p.owner)||enemies.reduce((best,e)=>!best||Math.abs(ad(e.a,a))<Math.abs(ad(best.a,a))?e:best,null);if(enemy){let pos=position(enemy),vx=pos.x-x,vy=pos.y-y,len=Math.hypot(vx,vy)||1;returns.push({x,y,vx:vx/len*330,vy:vy/len*330,target:enemy.id,life:1.4});$('message').textContent='PERFECT! Return shot launched +'+50*mult}else $('message').textContent='PERFECT BLOCK +'+50*mult}else{score+=10;burst(x,y,'#64c9ff',9);$('message').textContent='Shield block +10'}}else if(d<23){p.dead=true;hull--;combo=0;flash=.25;burst(cx,cy,'#ff668b',18);$('message').textContent='Hull hit!';if(hull<=0){draw();end(false);return}}}shots=shots.filter(p=>!p.dead);for(let p of returns){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;let target=enemies.find(e=>e.id===p.target);if(target){let pos=position(target);if(Math.hypot(pos.x-p.x,pos.y-p.y)<18){p.life=0;let mult=Math.min(5,1+Math.floor(combo/3));score+=100*mult;burst(pos.x,pos.y,'#ffb278',23);enemies=enemies.filter(e=>e.id!==target.id);$('message').textContent='RAIDER DESTROYED! +'+100*mult}}}returns=returns.filter(p=>p.life>0&&p.x>-30&&p.x<W+30&&p.y>-30&&p.y<H+30);for(let p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}sparks=sparks.filter(p=>p.t>0);hud();draw();if(elapsed>=90){end(true);return}requestAnimationFrame(x=>tick(x,id))}function draw(){ctx.fillStyle='#071425';ctx.fillRect(0,0,W,H);for(let s of stars){ctx.globalAlpha=.3+s.r/3;ctx.fillStyle='#b5d7f2';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;ctx.strokeStyle='#233e57';ctx.lineWidth=1;for(let r of [R,R*1.7]){ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke()}for(let e of enemies){let p=position(e);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(cy-p.y,cx-p.x)+Math.PI/2);ctx.shadowColor='#f05e7b';ctx.shadowBlur=9;ctx.fillStyle='#d56d83';ctx.strokeStyle='#ffd4cf';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(13,10);ctx.lineTo(0,5);ctx.lineTo(-13,10);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}ctx.save();ctx.translate(cx,cy);ctx.shadowColor='#5ca7d9';ctx.shadowBlur=12;ctx.fillStyle='#688ba7';ctx.strokeStyle='#d1e6f3';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-49);ctx.lineTo(13,-33);ctx.lineTo(19,-7);ctx.lineTo(22,22);ctx.lineTo(13,40);ctx.lineTo(-13,40);ctx.lineTo(-22,22);ctx.lineTo(-19,-7);ctx.lineTo(-13,-33);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#b7d4e2';ctx.fillRect(-8,-27,16,40);ctx.fillStyle='#76e3ff';for(let y of [-18,-7,4]){ctx.fillRect(-5,y,10,4)}ctx.fillStyle='#4bc9f7';ctx.fillRect(-14,38,9,14);ctx.fillRect(5,38,9,14);ctx.restore();ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.strokeStyle='#365b79';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.shadowColor=counter?'#fff5a8':'#5ff8d4';ctx.shadowBlur=counter?28:14;ctx.beginPath();ctx.arc(cx,cy,R,shield-.36,shield+.36);ctx.strokeStyle=counter?'#ffe3a2':'#65f0d4';ctx.lineWidth=14;ctx.lineCap='round';ctx.stroke();ctx.restore();for(let p of shots){ctx.fillStyle='#ff956e';ctx.shadowColor='#ff7455';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,5.5,0,TAU);ctx.fill()}for(let p of returns){ctx.fillStyle='#a0ffe8';ctx.shadowColor='#8bffe2';ctx.shadowBlur=17;ctx.beginPath();ctx.arc(p.x,p.y,6,0,TAU);ctx.fill()}ctx.shadowBlur=0;for(let p of sparks){ctx.globalAlpha=Math.min(1,p.t*3);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,TAU);ctx.fill()}ctx.globalAlpha=1;if(flash){ctx.fillStyle='rgba(170,225,255,'+(flash*.18)+')';ctx.fillRect(0,0,W,H)}}resize();draw();if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>{resize();draw()}).observe(arena);else window.addEventListener('resize',()=>{resize();draw()});})();
</script></body></html>
